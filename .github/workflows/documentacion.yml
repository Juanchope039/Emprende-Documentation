# Verificación de la documentación de Emprende.
#
# Encabezados, enlaces, referencias, plan y versiones: las reglas de docs/22-documentacion.md,
# comprobadas en cada push y en cada PR. Una regla que depende de que alguien se acuerde no se
# cumple (ADR-027).

name: Documentación

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    name: Verificar la documentación
    runs-on: ${{ vars.ETIQUETA_DEL_RUNNER || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Para exigir que suba la versión de lo que cambió hay que poder leer el contenido anterior.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verificar
        # En un PR se compara contra la rama base; en un push, contra lo que había antes. En el primer
        # push de una rama no hay «antes» —el SHA llega en ceros— y solo se omite esa comparación.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/docs/documentar.mjs verificar --base "$BASE"

  compartido:
    name: Lo compartido está al día
    # La puerta de ADR-072, del lado de la fuente: que el manifiesto no nombre una skill, una regla
    # o un agente que ya no existe. Las copias las compara cada repositorio de código en su propia
    # tubería, contra esta fuente: aquí los hermanos no están en disco y se saltan con aviso.
    runs-on: ${{ vars.ETIQUETA_DEL_RUNNER || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verificar lo compartido
        run: node scripts/agentes/verificar.mjs

  tuberia-completa:
    name: Tubería completa
    # La puerta que pide `develop` en los repositorios de código: que la tubería haya llegado al
    # final, sin juzgar el resultado (ADR-048). Aquí no hay `develop` y nadie la exige: existe
    # para que las ramas de los cuatro repositorios se pidan con los mismos dos nombres.
    runs-on: ${{ vars.ETIQUETA_DEL_RUNNER || 'ubuntu-latest' }}
    needs: [verificar, compartido]
    if: always()

    steps:
      - name: Qué resultado trajo cada trabajo
        env:
          RESULTADOS: ${{ toJSON(needs) }}
        run: echo "$RESULTADOS"

  tuberia-en-verde:
    name: Tubería en verde
    # Lo que `main` exige para recibir un PR: ningún trabajo en rojo ni cancelado (ADR-048). Un
    # trabajo saltado no la rompe, porque GitHub lo reporta como `skipped` y eso no es un fallo.
    runs-on: ${{ vars.ETIQUETA_DEL_RUNNER || 'ubuntu-latest' }}
    needs: [verificar, compartido]
    if: always()

    steps:
      - name: Qué resultado trajo cada trabajo
        env:
          RESULTADOS: ${{ toJSON(needs) }}
        run: echo "$RESULTADOS"

      - name: Ningún trabajo en rojo
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
