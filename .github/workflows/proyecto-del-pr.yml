# El PR está en el proyecto: mira si el PR está en «Prisma project», el proyecto 4 de Juanchope039,
# que es el tablero.
#
# ESTAR EN EL TABLERO ES RECOMENDADO, NO OBLIGATORIO (ADR-073). Se agrega a mano, con el engranaje
# de Projects en la barra del PR, eligiendo «Prisma project». Ninguna regla de rama pide este check.
#
# ESTE TRABAJO AVISA Y NO FALLA, y se queda porque una puerta que no se quiere bloqueante se vuelve
# advertencia y no se borra (ADR-065). Cuando el PR no está —o no se puede saber— sale una
# advertencia y el trabajo queda en verde. El mismo archivo vive en los cuatro repositorios, y el
# monorepo no lo lleva.
#
# Los proyectos de un usuario no los lee GITHUB_TOKEN: hace falta el secreto PRISMA_PROYECTO_TOKEN,
# un token fino del dueño con Pull requests y Projects en lectura. Sin él, el trabajo solo avisa.
#
# Agregar el PR al proyecto no dispara ningún evento del PR. Por eso el trabajo espera hasta dos
# minutos a que el auto-add del proyecto lo agregue, y si entró después, se vuelve a correr a mano.

name: Proyecto del PR

on:
  pull_request:
    branches: [develop, qa, main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

# Una sola comprobación viva por PR: la nueva reemplaza a la que todavía espera.
concurrency:
  group: proyecto-del-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  en-el-proyecto:
    name: El PR está en el proyecto
    # En los runners de GitHub, no en el propio: necesita `gh` seguro, y no compila nada.
    runs-on: ${{ vars.ETIQUETA_DEL_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5

    steps:
      - name: Buscar el PR en el proyecto
        env:
          GH_TOKEN: ${{ secrets.PRISMA_PROYECTO_TOKEN }}
          DUENO: Juanchope039
          NUMERO: '4'
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Falta el secreto PRISMA_PROYECTO_TOKEN: un token fino del dueño con Pull requests y Projects en lectura (ADR-062)."
            exit 0
          fi

          CONSULTA='query($o: String!, $r: String!, $n: Int!) {
            repository(owner: $o, name: $r) { pullRequest(number: $n) {
              projectItems(first: 50) { nodes { project { number owner {
                ... on User { login } ... on Organization { login } } } } } } } }'
          FILTRO="[.data.repository.pullRequest.projectItems.nodes[].project
            | select(.number == $NUMERO and .owner.login == \"$DUENO\")] | length"

          for intento in 1 2 3 4 5 6 7; do
            # Si GitHub rechaza la consulta (token sin permisos, sin el repositorio o vencido), dice por qué.
            if ! ESTA=$(gh api graphql -f query="$CONSULTA" -f o="${REPO%/*}" -f r="${REPO#*/}" \
              -F n="$PR" --jq "$FILTRO" 2>&1); then
              # La anotacion se corta en el primer salto: primero la ultima linea, que es la de gh.
              ULTIMA=$(echo "$ESTA" | tr -d '\r' | grep -v '^[[:space:]]*$' | tail -n 1)
              echo "::warning::GitHub rechazó la consulta del proyecto con PRISMA_PROYECTO_TOKEN: $ULTIMA"
              echo "$ESTA"
              exit 0
            fi
            if [ "$ESTA" -gt 0 ]; then
              echo "El PR #$PR está en el proyecto $NUMERO de $DUENO."
              exit 0
            fi
            [ "$intento" -lt 7 ] && sleep 20
          done

          echo "::warning::El PR #$PR no está en el proyecto $NUMERO de $DUENO («Prisma project»)."
          echo "Si lo quieres en el tablero, dale al engranaje de Projects en la barra del PR y elige"
          echo "«Prisma project»; desde una sesión con GraphQL también sirve"
          echo "gh pr edit $PR --add-project 'Prisma project'."
          echo "Estar en el tablero es recomendado, no obligatorio (ADR-073): el trabajo queda en verde."
          exit 0
